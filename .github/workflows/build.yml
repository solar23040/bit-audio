name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bit-audio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  security-harness:
    name: Security attacks (:mesh + :crypto on FakeNetwork)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: python -m pip install --disable-pip-version-check "PyNaCl>=1.5"

      - name: Contract vectors match docs/packet-format.md v1
        working-directory: security/attack-tests
        run: python contract_vector.py --check

      - name: Harness self-check
        working-directory: security/attack-tests
        run: python selfcheck.py

      - name: Reference mesh-rule cases (executable spec, no hardware)
        working-directory: security/attack-tests
        run: python test_mesh_contract.py

      - name: Real mesh + crypto attack suite
        run: >
          ./gradlew --no-daemon --stacktrace
          -I security/ci/harness.init.gradle
          :security-harness:testDebugUnitTest
          --tests "com.solar23040.bitaudio.security.MeshAttackTest"
          --tests "com.solar23040.bitaudio.security.ContractVectorTest"

      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-attacks-${{ github.run_number }}
          path: |
            security/harness/build/reports/tests/**
            security/harness/build/test-results/**
            security/harness/build/security-observations.txt
          if-no-files-found: ignore
          retention-days: 14

  security-fuzz:
    name: Security fuzz (time-boxed packet decode)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: python -m pip install --disable-pip-version-check "PyNaCl>=1.5"

      - name: JVM packet-decode fuzz (90 s per mesh implementation)
        env:
          SECURITY_FUZZ_SECONDS: "90"
        run: >
          ./gradlew --no-daemon --stacktrace
          -I security/ci/harness.init.gradle
          :security-harness:testDebugUnitTest
          --tests "com.solar23040.bitaudio.security.PacketDecodeFuzzTest"

      - name: Python structure-aware fuzz (dry sink, 15 s)
        working-directory: security/attack-tests
        run: >
          python fuzz_packets.py --sink dry --duration 15 --rate 200
          --seed 20261025

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-fuzz-${{ github.run_number }}
          path: |
            security/harness/build/reports/tests/**
            security/harness/build/test-results/**
            security/attack-tests/captures/fuzz/**
          if-no-files-found: ignore
          retention-days: 14
