name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bit-audio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  selfcheck:
    name: Security selfcheck (contract vectors + mesh attacks)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: python -m pip install --disable-pip-version-check "PyNaCl>=1.5"

      - name: Contract vectors match docs/packet-format.md v1
        working-directory: security/attack-tests
        run: python contract_vector.py --check

      - name: Harness self-check
        working-directory: security/attack-tests
        run: python selfcheck.py

      - name: Mesh attack cases over FakeNetwork
        working-directory: security/attack-tests
        run: python test_mesh_contract.py

      - name: Parser fuzz smoke (SEC-012)
        working-directory: security/attack-tests
        run: python fuzz_packets.py --self-check
